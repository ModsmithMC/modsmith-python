[project]
name = "modsmith"
version = "0.1.0"
description = "A Python toolkit for Minecraft modpacks, mod loaders and game instances."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "YufengPeng", email = "pengyufeng2003@outlook.com" }]
keywords = ["minecraft", "modpack", "modrinth", "curseforge", "forge", "fabric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "platformdirs>=4.3",
    "pydantic>=2.9",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/PaPa-jun/ModSmith"
Documentation = "https://papa-jun.github.io/ModSmith/"
Issues = "https://github.com/PaPa-jun/ModSmith/issues"
Changelog = "https://github.com/PaPa-jun/ModSmith/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
]
lint = [
    "pre-commit>=4.0",
    "ruff>=0.8",
]
typing = [
    "pyright>=1.1.390",
    "types-requests>=2.32",
]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.1.1",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modsmith"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI cannot follow relative links or render Mermaid.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(docs/[^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/PaPa-jun/ModSmith/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://)([^"]+)"'
replacement = 'href="https://github.com/PaPa-jun/ModSmith/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://)([^)]+)\)'
replacement = '](https://github.com/PaPa-jun/ModSmith/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '```mermaid[\s\S]*?```\n\n'
replacement = ''

[tool.pytest.ini_options]
minversion = "9.0"
strict = true
testpaths = ["tests/unit", "tests/functional"]
pythonpath = ["."]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["modsmith"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "PT", "RUF", "SIM", "T20", "UP"]
ignore = ["D105", "D107", "E501"]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["D"]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["modsmith", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["modsmith"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
